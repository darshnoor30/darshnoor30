<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Darshnoor Kaur cybersecurity portfolio banner</title>
  <desc id="description">Dark blue security operations inspired banner with a shield, network grid, and neon accents.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b14"/>
      <stop offset="0.52" stop-color="#091725"/>
      <stop offset="1" stop-color="#07101d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#56e7ff"/>
      <stop offset="0.55" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#47f0a5"/>
    </linearGradient>
    <radialGradient id="glowA">
      <stop offset="0" stop-color="#2ac8ff" stop-opacity=".27"/>
      <stop offset="1" stop-color="#2ac8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0" stop-color="#865dff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#865dff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#7ce8ff" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#background)"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)"/>
  <circle cx="102" cy="115" r="210" fill="url(#glowA)"/>
  <circle cx="1090" cy="230" r="270" fill="url(#glowB)"/>

  <g fill="none" stroke="#64dcff" stroke-opacity=".22" stroke-width="1.4">
    <path d="M0 78h78l24 24h88"/>
    <path d="M0 244h112l31-31h78"/>
    <path d="M938 61h96l28 28h138"/>
    <path d="M914 272h112l34-34h140"/>
  </g>
  <g fill="#73e9ff" filter="url(#softGlow)">
    <circle cx="103" cy="102" r="3.5"/>
    <circle cx="143" cy="213" r="3.5"/>
    <circle cx="1062" cy="89" r="3.5"/>
    <circle cx="1060" cy="238" r="3.5"/>
  </g>

  <g transform="translate(72 73)">
    <path d="M88 0 158 25v55c0 48-28 79-70 103C46 159 18 128 18 80V25Z" fill="#071523" stroke="url(#accent)" stroke-width="4"/>
    <path d="M88 20 137 38v40c0 34-19 58-49 78-30-20-49-44-49-78V38Z" fill="none" stroke="#7fe8ff" stroke-opacity=".45" stroke-width="2"/>
    <path d="m61 83 18 18 38-43" fill="none" stroke="#49efad" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
    <circle cx="88" cy="91" r="61" fill="none" stroke="#8d83ff" stroke-opacity=".12" stroke-dasharray="4 9"/>
  </g>

  <g transform="translate(270 70)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="0" y="30" fill="#72e7ff" font-size="14" font-weight="700" letter-spacing="4">DEFENSIVE SECURITY • BUILD WITH PURPOSE</text>
    <text x="0" y="102" fill="#f4f8ff" font-size="56" font-weight="800" letter-spacing="1">DARSHNOOR KAUR</text>
    <rect x="0" y="124" width="690" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="0" y="164" fill="#a9b9ca" font-size="19" font-weight="500" letter-spacing="1.2">CYBERSECURITY  /  THREAT DETECTION  /  SECURE SYSTEMS</text>
    <g transform="translate(0 190)">
      <rect width="112" height="32" rx="16" fill="#0f2638" stroke="#48dff8" stroke-opacity=".35"/>
      <circle cx="19" cy="16" r="4" fill="#4af0aa" filter="url(#softGlow)"/>
      <text x="32" y="21" fill="#d9f7ff" font-size="12" font-weight="700" letter-spacing="1">ANALYZE</text>
      <rect x="125" width="105" height="32" rx="16" fill="#171f39" stroke="#9688ff" stroke-opacity=".4"/>
      <text x="148" y="21" fill="#e8e4ff" font-size="12" font-weight="700" letter-spacing="1">EXPLAIN</text>
      <rect x="243" width="106" height="32" rx="16" fill="#102a28" stroke="#49e9a7" stroke-opacity=".36"/>
      <text x="267" y="21" fill="#dcfff1" font-size="12" font-weight="700" letter-spacing="1">DEFEND</text>
    </g>
  </g>

  <g transform="translate(1030 134)" fill="none" stroke="url(#accent)" stroke-opacity=".6">
    <circle r="54" stroke-width="1.5" stroke-dasharray="5 8"/>
    <circle r="35" stroke-width="1"/>
    <circle r="7" fill="#55e9ff" stroke="none" filter="url(#softGlow)"/>
    <path d="M-76 0h35M41 0h35M0-76v35M0 41v35"/>
  </g>

  <rect x=".75" y=".75" width="1198.5" height="318.5" rx="27.25" fill="none" stroke="url(#accent)" stroke-opacity=".28" stroke-width="1.5"/>
</svg>
